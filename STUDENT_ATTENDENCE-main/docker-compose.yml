version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: rollcall-db
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./stu-back
    container_name: rollcall-backend
    ports:
      - "5008:5008"
    depends_on:
      - mongodb
    environment:
      - MONGO_URL=mongodb+srv://Arslan:Arslanali1234@cluster0.3vi64jz.mongodb.net/?appName=Cluster0
      - JWT_SECRET=rollcall_jwt_secret_key_2026_premium
      - PORT=5008
      - NODE_ENV=production

  frontend:
    build: ./stu-attendence
    container_name: rollcall-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo-data:
